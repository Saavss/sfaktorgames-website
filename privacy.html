sets/js/preview-db.js"></script><script src="assets/js/site-footer.js"></script><script>const translations={"tr":["Gizlilik Politikası","Bu politika yalnızca SFAKTOR GAMES web sitesine uygulanır. Mobil oyunlar için ayrı gizlilik politikaları bulunmaktadır.","Web sitesi hakkında","Bu web sitesi oyunlarımız, stüdyomuz, haberlerimiz ve iletişim bilgilerimiz hakkında tanıtım amaçlı içerik sunar.","Teknik veriler","Site ziyaretleri sırasında kullanılan barındırma hizmeti, IP adresi, tarayıcı bilgileri ve erişim zamanı gibi teknik kayıtları güvenlik ve hizmetin sunulması amacıyla işleyebilir. Bu kayıtlar GitHub Pages gibi barındırma sağlayıcılarının gizlilik koşullarına tabidir.","Dış bağlantılar ve gömülü içerik","Sitede oyun mağazalarına, sosyal medya platformlarına ve YouTube videolarına bağlantılar bulunabilir. Üçüncü taraf içerikleri açtığınızda ilgili sağlayıcının gizlilik politikası geçerli olur.","Çerezler ve dil seçimi","Sitenin dil seçiminizi hatırlaması için tarayıcınızın yerel depolama alanı kullanılabilir. Bu tercih, reklam amaçlı takip çerezi olarak tasarlanmamıştır.","İletişim","Bize e-posta gönderirseniz paylaştığınız iletişim bilgileri ve mesajınız talebinize cevap verilmesi amacıyla işlenebilir.","Saklama ve talepler","İletişim mesajları gerekli olduğu sürece saklanabilir. Erişim, düzeltme veya silme talepleriniz için aşağıdaki e-posta adresine başvurabilirsiniz. Barındırma ve üçüncü taraf platform verileri kendi sağlayıcılarının politikalarına tabidir.","Güncellemeler","Bu web sitesi politikası, sitenin işleyişi değiştiğinde güncellenebilir."],"en":["Privacy Policy","This policy applies only to the SFAKTOR GAMES website. Our mobile games have separate privacy policies.","About this website","This website provides information about our studio, games, news and ways to contact us.","Technical information","Our hosting provider may process technical access information such as IP address, browser type and access time to deliver and protect the website. Such . Für Auskunfts-, Berichtigungs- oder Löschanfragen kontaktieren Sie uns unten. Für Anbieter gelten deren eigene Regeln.","Änderungen","Wir können diese Erklärung aktualisieren, wenn sich die Website ändert."],"ko":["개인정보 처리방침","이 방침은 SFAKTOR GAMES 웹사이트에만 적용됩니다. 모바일 게임에는 별도의 개인정보 처리방침이 적용됩니다.","웹사이트 안내","본 웹사이트는 스튜디오, 게임, 소식 및 문의 방법에 대한 정보를 제공합니다.","기술 정보","호스팅 제공업체는 사이트 제공 및 보호를 위해 IP 주소, 브라우저 유형, 접속 시간 등의 기술 정보를 처리할 수 있습니다. 해당 업체의 개인정보 처리방침이 적용됩니다.","외부 링크 및 삽입 콘텐츠","앱 스토어, 소셜 미디어 및 YouTube로 연결되는 링크가 포함될 수 있습니다. 외부 서비스를 이용하면 해당 제공업체의 정책이 적용됩니다.","쿠키 및 언어 설정","선택한 언어를 기억하기 위해 브라우저 로컬 저장소를 사용할 수 있습니다. 이 기능은 광고 추적용으로 설계되지 않았습니다.","문의","이메일 문의 시 답변을 위해 이메일 주소와 메시지를 처리할 수 있습니다.","보관 및 요청","문의 처리에 필요한 기간 동안 연락 내용을 보관할 수 있습니다. 열람, 수정, 삭제 요청은 아래 이메일로 보내주세요.","변경","웹사이트 운영 방식이 변경되면 본 방침을 갱신할 수 있습니다."],"pt":["Política de Privacidade","Esta política aplica-se apenas ao site da SFAKTOR GAMES. Os nossos jogos móveis têm políticas de privacidade separadas.","Sobre este site","Este site apresenta informações sobre o nosso estúdio, jogos, notícias e canais de contato.","Informações técnicas","O provedor de hospedagem pode processar dados técnicos, como endereço IP, navegador e horário de acesso, para disponibilizar e proteger o site. Aplicam-se as políticas do provedor.","Links e conteúdo externo","O site pode conter links para lojas de aplicativos, redes sociais e vídeos do YouTube. Os serviços externos seguem suas próprias políticas.","Cookies e idioma","Podemos usar o armazenamento local do navegador para lembrar o idioma escolhido. Esse recurso não foi criado para rastreamento publicitário.","Contato","Se você enviar um e-mail, poderemos usar seu endereço e sua mensagem para responder.","Retenção e solicitações","Podemos guardar correspondência pelo tempo necessário para responder. Solicitações de acesso, correção ou exclusão podem ser enviadas ao contato abaixo.","Atualizações","Esta política poderá ser atualizada se as práticas do site mudarem."],"zh-CN":["隐私政策","本政策仅适用于 SF
