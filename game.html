<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Game | SFAKTOR GAMES</title>
  <meta name="description" content="">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .detail-hero{position:relative;min-height:85vh;display:flex;align-items:flex-end;padding:150px 5vw 85px;overflow:hidden}
    .detail-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 38%,#153354 0%,#0a1525 44%,#050a10 100%);background-size:cover;background-position:center}
    .detail-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,8,15,.95),rgba(3,8,15,.52) 55%,rgba(3,8,15,.32)),linear-gradient(0deg,#050a10,transparent 56%)}
    .detail-content{position:relative;z-index:2;width:min(750px,100%)}
    .detail-logo{max-width:min(440px,75vw);max-height:190px;margin-bottom:25px}
    .detail-content h1{font-size:clamp(3.5rem,9vw,7rem)}
    .detail-copy{color:#bdd0e1;line-height:1.8;font-size:1.05rem}
    .detail-rich{max-width:900px;color:#c5d3e3;font-size:clamp(1rem,1.3vw,1.15rem);line-height:1.85;overflow-wrap:anywhere}
    .detail-rich p{margin:0 0 1.25rem}.detail-rich h3{color:#fff;font-size:1.4rem;margin:2rem 0 1rem}
    .detail-rich ul{padding-left:1.5rem;margin:0 0 1.5rem;list-style:disc}.detail-rich li{margin:.6rem 0;padding-left:.2rem}
    .detail-rich strong{color:#f4f8ff}.video-fallback{margin-top:14px;color:#a8bdd3;font-size:.95rem}
    .video-fallback a{color:#56adff;text-decoration:underline}.trailer-frame{max-width:1100px}
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
    .gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid #183653;transition:.3s ease}
    .gallery img:hover{transform:scale(1.02);border-color:#42b0ff}
    @media(max-width:800px){.gallery{grid-template-columns:1fr}.detail-hero{min-height:75vh}}
  </style>
</head>
<body>
<div class="cursor-glow" id="cursorGlow"></div>
<header class="site-header">
  <a class="brand" href="index.html" id="detailBrand">SFAKTOR <span>GAMES</span></a>
  <button class="menu-btn" aria-label="Menü">☰</button>
  <div class="header-right"><nav>
    <a href="index.html#games" data-detail-i18n="games">Oyunlar</a>
    <a href="about.html" data-detail-i18n="about">Hakkımızda</a>
    <a href="index.html#news" data-detail-i18n="news">Haberler</a>
    <a href="index.html#contact" data-detail-i18n="contact">İletişim</a>
  </nav><div class="language-switcher"><button class="lang-btn"><span id="currentLang">TR</span> ▾</button><div class="lang-menu"><button data-lang="tr">Türkçe</button><button data-lang="en">English</button><button data-lang="de">Deutsch</button><button data-lang="ko">한국어</button><button data-lang="pt">Português</button><button data-lang="zh-CN">简体中文</button><button data-lang="zh-TW">繁體中文</button></div></div></div>
</header>

<section class="detail-hero">
  <div id="detailBg" class="detail-bg hero-no-image"></div>
  <div class="detail-content">
    <p id="detailStatus" class="eyebrow">SFAKTOR GAMES</p>
    <div id="detailTitle"></div>
    <div id="detailPlatforms" class="hero-badges"></div>
    <p id="detailDescription" class="detail-copy"></p>
    <div id="detailStores" class="hero-store-row"></div>
  </div>
</section>

<main>
  <section class="section reveal">
    <div class="section-heading"><div><p class="eyebrow" data-detail-i18n="aboutGame">OYUN HAKKINDA</p><h2 data-detail-i18n="details">Oyun Detayları</h2></div></div>
    <div id="detailLong" class="detail-rich"></div>
  </section>
  <section id="trailerSection" class="section reveal hidden">
    <div class="section-heading"><div><p class="eyebrow" data-detail-i18n="video">VİDEO</p><h2 data-detail-i18n="trailer">Oyun Fragmanı</h2></div></div>
    <div id="trailerFrame" class="trailer-frame"></div><p class="video-fallback" id="videoHelp"></p>
  </section>
  <section id="gallerySection" class="section reveal hidden">
    <div class="section-heading"><div><p class="eyebrow" data-detail-i18n="gallery">GALERİ</p><h2 data-detail-i18n="screens">Ekran Görüntüleri</h2></div></div>
    <div id="detailGallery" class="gallery"></div>
  </section>
</main>

<footer>
  <a class="brand" href="index.html">SFAKTOR <span>GAMES</span></a>
  <p>© <span id="year"></span> SFAKTOR GAMES.</p>
  <div><a id="gamePrivacyLink" href="privacy.html" data-privacy-label>Gizlilik Politikası</a></div>
</footer>
<script src="assets/js/site-footer.js"></script>

<script src="assets/js/preview-db.js"></script>
<script src="assets/js/effects.js"></script>
<script>
document.getElementById("year").textContent=new Date().getFullYear();
const esc=v=>String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const safeUrl=v=>{if(/^assets\/uploads\/[a-zA-Z0-9_./-]+$/.test(v)&&!v.includes(".."))return v;try{const u=new URL(v);return ["http:","https:"].includes(u.protocol)?u.href:"#"}catch{return "#"}};
(async()=>{
  const slug=new URLSearchParams(location.search).get("slug");
  const {data:g,error}=await db.from("games").select("*").eq("slug",slug).maybeSingle();
  if(error||!g){document.getElementById("detailTitle").innerHTML="<h1>Game not found.</h1>";return;}
  const requestedLang=new URLSearchParams(location.search).get("lang");
  const lang=["tr","en","de","ko","pt","zh-CN","zh-TW"].includes(requestedLang)?requestedLang:(["tr","en","de","ko","pt","zh-CN","zh-TW"].includes(localStorage.getItem("sfaktor_lang"))?localStorage.getItem("sfaktor_lang"):"tr");
  const words={tr:{games:"Oyunlar",about:"Hakkımızda",news:"Haberler",contact:"İletişim",aboutGame:"OYUN HAKKINDA",details:"Oyun Detayları",video:"VİDEO",trailer:"Oyun Fragmanı",gallery:"GALERİ",screens:"Ekran Görüntüleri",watch:"YouTube'da İzle",videoInfo:"Yerel önizlemede video oynatılmayabilir. YouTube'da açabilir veya GitHub Pages üzerinde deneyebilirsiniz."},en:{games:"Games",about:"About",news:"News",contact:"Contact",aboutGame:"ABOUT THE GAME",details:"Game Details",video:"VIDEO",trailer:"Game Trailer",gallery:"GALLERY",screens:"Screenshots",watch:"Watch on YouTube",videoInfo:"Video playback may be unavailable in local preview. Open on YouTube or test on GitHub Pages."},de:{games:"Spiele",about:"Über uns",news:"News",contact:"Kontakt",aboutGame:"ÜBER DAS SPIEL",details:"Spieldetails",video:"VIDEO",trailer:"Spieltrailer",gallery:"GALERIE",screens:"Screenshots",watch:"Auf YouTube ansehen",videoInfo:"In der lokalen Vorschau ist die Wiedergabe möglicherweise nicht verfügbar. Auf YouTube öffnen oder auf GitHub Pages testen."}};
  document.querySelectorAll('[data-detail-i18n]').forEach(el=>el.textContent=(words[lang]||words.en)[el.dataset.detailI18n]);
  document.getElementById('currentLang').textContent=lang.toUpperCase();
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{localStorage.setItem('sfaktor_lang',b.dataset.lang);const url=new URL(location.href);url.searchParams.set('lang',b.dataset.lang);location.href=url.href;}));
  document.querySelector('.lang-btn').addEventListener('click',()=>document.querySelector('.lang-menu').classList.toggle('open'));
  document.querySelector('.menu-btn').addEventListener('click',()=>document.querySelector('.site-header nav').classList.toggle('open'));
  document.querySelectorAll('a[href^="index.html"]').forEach(a=>{const u=new URL(a.href);u.searchParams.set('lang',lang);a.href=u.href});
  const pick=(field)=>g[`${field}_${lang}`]||g[`${field}_en`]||g[`${field}_tr`]||g[field]||"";
  const displayTitle=pick("title");
  const displayDescription=pick("description");
  const displayLong=pick("long_description")||displayDescription;
  document.documentElement.lang=lang;
  const privacyLink=document.getElementById('gamePrivacyLink');if(privacyLink)privacyLink.href=(window.SFAKTOR_PREVIEW?'ONIZLEME-OYUN-GIZLILIK.html':'game-privacy.html')+'?game='+encodeURIComponent(g.slug);
  document.title=displayTitle+" | SFAKTOR GAMES";
  document.querySelector('meta[name="description"]').content=displayDescription;
  document.getElementById("detailStatus").textContent=g.status||"SFAKTOR GAMES";
  document.getElementById("detailDescription").textContent=displayDescription;
  function richText(value){
    const lines=String(value||'').replace(/\r\n?/g,'\n').split('\n');let html='',inList=false,paragraph=[];
    const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    const flush=()=>{if(paragraph.length){html+='<p>'+paragraph.map(inline).join('<br>')+'</p>';paragraph=[]}};
    for(const raw of lines){const line=raw.trim();if(!line){flush();if(inList){html+='</ul>';inList=false}continue}
      if(/^[-•]\s+/.test(line)){flush();if(!inList){html+='<ul>';inList=true}html+='<li>'+inline(line.replace(/^[-•]\s+/,''))+'</li>';continue}
      if(inList){html+='</ul>';inList=false}
      if(/^\*\*[^*]+\*\*$/.test(line)){flush();html+='<h3>'+inline(line)+'</h3>'}else paragraph.push(line);
    }flush();if(inList)html+='</ul>';return html;
  }
  document.getElementById("detailLong").innerHTML=richText(displayLong);
  document.getElementById("detailPlatforms").innerHTML=(g.platforms||[]).map(p=>`<span class="hero-badge">${esc(p)}</span>`).join("");
  document.getElementById("detailTitle").innerHTML=g.logo_url?`<img class="detail-logo" src="${safeUrl(g.logo_url)}" alt="${esc(displayTitle)}">`:`<h1>${esc(displayTitle)}</h1>`;
  const bg=Object.prototype.hasOwnProperty.call(g,"detail_banner_url")?(g.detail_banner_url||""):(g.banner_url||"");if(bg){const d=document.getElementById("detailBg");d.classList.remove("hero-no-image");d.style.backgroundImage=`url('${safeUrl(bg)}')`;}
  let stores="";if(g.google_play_url)stores+=`<a class="hero-store-btn" target="_blank" href="${safeUrl(g.google_play_url)}">Google Play</a>`;
  if(g.app_store_url)stores+=`<a class="hero-store-btn" target="_blank" href="${safeUrl(g.app_store_url)}">App Store</a>`;
  if(g.steam_url)stores+=`<a class="hero-store-btn" target="_blank" href="${safeUrl(g.steam_url)}">Steam</a>`;
  if(g.trailer_url)stores+=`<a class="hero-detail-btn" target="_blank" href="${safeUrl(g.trailer_url)}">Watch Trailer ▶</a>`;
  document.getElementById("detailStores").innerHTML=stores;
  function youtubeId(value){
    try{
      const u=new URL(value);
      const host=u.hostname.toLowerCase().replace(/^www\./,"");
      let id="";
      if(host==="youtu.be")id=u.pathname.split("/")[1]||"";
      else if(host==="youtube.com"||host==="m.youtube.com"||host==="youtube-nocookie.com"){
        if(u.pathname==="/watch")id=u.searchParams.get("v")||"";
        else if(/^\/(embed|shorts|live)\//.test(u.pathname))id=u.pathname.split("/")[2]||"";
      }
      return /^[A-Za-z0-9_-]{11}$/.test(id)?id:null;
    }catch{return null;}
  }
  const ytId=youtubeId(g.trailer_url||"");
  if(ytId){
    document.getElementById("trailerSection").classList.remove("hidden");
    const iframe=document.createElement("iframe");
    iframe.src="https://www.youtube.com/embed/"+ytId+"?rel=0";
    iframe.title=displayTitle+" trailer";
    iframe.loading="lazy";
    iframe.referrerPolicy="strict-origin-when-cross-origin";
    iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen=true;
    const videoLink='https://www.youtube.com/watch?v='+ytId;
    document.getElementById("videoHelp").innerHTML=esc((words[lang]||words.en).videoInfo)+' <a target="_blank" rel="noopener noreferrer" href="'+videoLink+'">'+esc((words[lang]||words.en).watch)+'</a>';
    if(location.protocol==='file:'){
      document.getElementById("trailerFrame").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:220px"><a class="hero-store-btn" target="_blank" rel="noopener noreferrer" href="'+videoLink+'">▶ '+esc((words[lang]||words.en).watch)+'</a></div>';
    }else document.getElementById("trailerFrame").appendChild(iframe);
  }
  if(g.screenshots?.length){document.getElementById("gallerySection").classList.remove("hidden");document.getElementById("detailGallery").innerHTML=g.screenshots.map(x=>`<img src="${safeUrl(x)}" alt="${esc(displayTitle)} screenshot">`).join("");}
  const {data:s}=await db.from("site_settings").select("*").eq("id",1).maybeSingle();
  if(s?.logo_url)document.querySelectorAll(".brand").forEach(b=>b.innerHTML=`<img src="${safeUrl(s.logo_url)}" alt="SFAKTOR GAMES">`);
})();
</script>
</body>
</html>
